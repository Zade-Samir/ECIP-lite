<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECIP Enterprise Knowledge Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        h1 { color: #38bdf8; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #1e293b; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card h3 { margin-top: 0; color: #94a3b8; }
        .stat { font-size: 2rem; font-weight: bold; color: #38bdf8; }
    </style>
</head>
<body>
    <h1>ECIP Enterprise Knowledge Dashboard</h1>
    <p>Centralized view of codebase architecture, knowledge graph, system health, and analytics.</p>
    <div class="grid">
        <div class="card">
            <h3>Total Repositories</h3>
            <div class="stat" id="repos">3</div>
        </div>
        <div class="card">
            <h3>Indexed Files</h3>
            <div class="stat" id="files">42</div>
        </div>
        <div class="card">
            <h3>Dependency Nodes</h3>
            <div class="stat" id="nodes">150</div>
        </div>
        <div class="card">
            <h3>System Status</h3>
            <div class="stat" style="color: #4ade80;" id="status">HEALTHY</div>
        </div>
    </div>
</body>
</html>
